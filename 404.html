<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>404 — Duda Negrão</title>

    <meta name="description" content="The page you are looking for could not be found.">
    <meta name="robots" content="noindex, follow">

    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <!-- FAVICONS -->
    <link rel="icon" href="/favicon/dn-favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" sizes="180x180">

    <!-- STYLES -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/404.css">
</head>

<body class="page page--404">

    <main class="not-found" data-404>

        <!-- VIDEO -->
        <div class="not-found__media" data-404-media>
            <video class="not-found__video" data-404-video autoplay muted loop playsinline preload="metadata"
                aria-hidden="true" tabindex="-1">
                <source src="/videos/home/duda-16-9.mp4" type="video/mp4">
            </video>
        </div>

        <div class="not-found__shade" aria-hidden="true"></div>

        <!-- CONTENT -->
        <div class="not-found__content">

            <a class="not-found__brand" href="/" data-404-meta>
                Duda Negrão
            </a>

            <div class="not-found__status meta meta--muted" data-404-meta>
                Error / Page Not Found
            </div>

            <div class="not-found__code" aria-label="Error 404" data-404-code>
                <span class="not-found__digit" data-404-digit>4</span>
                <span class="not-found__digit" data-404-digit>0</span>
                <span class="not-found__digit" data-404-digit>4</span>
            </div>

            <div class="not-found__message" data-404-meta>
                The page you're looking for doesn't exist.
            </div>

            <a class="not-found__button" href="/" data-404-button>
                <span class="not-found__button-label">
                    Return Home
                </span>
            </a>

        </div>

    </main>

    <script type="module" src="/src/js/pages/404.js"></script>
</body>

</html>
